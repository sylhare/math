[project]
name = "math-explorations"
version = "0.1.0"
description = "Interactive mathematics explorations"
requires-python = ">=3.11"

dependencies = [
    "marimo==0.19.6",
    "polars==1.37.1",
    "plotly==6.5.2",
    "numpy==2.4.1",
    "sympy==1.14.0",
    "scipy==1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-timeout==2.4.0",
    "playwright==1.52.0",
    "ruff==0.11.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_explorations"]

[tool.marimo]
package_manager = "uv"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
timeout = 120

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "SIM108",  # ternary operator (less readable in math code)
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = [
    "F841",    # local variable assigned but never used (marimo cell pattern: _fig = ...)
    "E402",    # module-level import not at top (marimo cells import inline)
    "F811",    # redefinition of unused name (marimo cell re-exports)
    "B018",    # useless expression (marimo displays last expression: _fig)
    "RUF001",  # ambiguous unicode in strings (math content uses Greek letters, ×, ∪, etc.)
    "RUF003",  # ambiguous unicode in comments (math notation in code comments)
    "RUF052",  # local dummy variable accessed (marimo _var pattern)
    "B905",    # zip without strict= (plotting loops don't need it)
]
"lean/**/*.py" = [
    "F841",    # marimo cell pattern
    "E402",    # marimo cells import inline
    "B018",    # marimo displays last expression
    "RUF001",  # ambiguous unicode in strings (Greek letters in math)
    "RUF003",  # ambiguous unicode in comments
    "RUF052",  # local dummy variable accessed (marimo _var pattern)
]
"tests/*.py" = [
    "B011",    # assert False (valid pytest pattern for multi-condition assertions)
    "E731",    # lambda assignment (convenient in test fixtures)
]
"research/lean_driven_notebooks/*.py" = [
    # Lean-driven notebook experiment: transcribes Lean (Greek-heavy) into LaTeX and runs a
    # marimo sandbox, so it needs the same relaxations as lean/** and notebooks/*.
    "RUF001",  # ambiguous unicode in strings (Greek letters in Lean statements / LaTeX)
    "RUF002",  # ambiguous unicode in docstrings (ℝ and Greek in worked examples)
    "RUF003",  # ambiguous unicode in comments (Greek in worked examples)
    "E402",    # imports after a sys.path insert (bridge wiring) and marimo inline imports
    "F841",    # marimo cell pattern (_var assigned, displayed by the cell)
    "B018",    # marimo displays the last expression
]
"research/**/*.py" = [
    # Staging/experiment figure scripts. Real-error checks (F-codes, correctness) stay ON; only these
    # four are relaxed, each for a concrete reason (everything else, incl. B905/RUF046/B007, is fixed):
    "E701",    # `if x: y` / `a; b` - the compact one-line axis setup this folder is authored in;
    "E702",    #   the only auto-fix is `ruff format`, a 1400-line rewrite of throwaway visual code.
    "UP031",   # printf `%` in prints/titles - ruff rewrites it to .format(), not cleaner; mostly in
               #   the frozen attempt/ files we deliberately do not churn.
    "RUF059",  # unused unpack in demo tuples - a preview-only rule (does not fire under pinned ruff).
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
